<p-menu
    [model]="items"
    class="bg-transparent *:h-full *:border-none *:bg-transparent"
    [attr.data-testid]="'sidebar-menu'"
>
    <ng-template
        #submenuheader
        let-item
    >
        <span
            class="-ml-3 font-bold text-primary"
            [attr.data-testid]="'sidebar-submenu-' + item.label"
            >{{ item.label | translate }}</span
        >
    </ng-template>
    <ng-template
        #item
        let-item
    >
        <a
            pRipple
            [routerLink]="item.route"
            [attr.data-testid]="'sidebar-item-' + item.label"
            class="p-menu-item-link flex items-center px-2"
        >
            <span
                [class]="item.icon"
                [attr.data-testid]="'sidebar-item-icon-' + item.label"
            ></span>
            <span
                class="ml-2"
                [attr.data-testid]="'sidebar-item-label-' + item.label"
                >{{ item.label | translate }}</span
            >
            <p-badge
                *ngIf="item.badge"
                class="ml-auto"
                [value]="item.badge"
                [attr.data-testid]="'sidebar-item-badge-' + item.label"
            />
            <span
                *ngIf="item.shortcut"
                class="ml-auto rounded border p-1 text-xs border-surface bg-emphasis text-muted-color"
                [attr.data-testid]="'sidebar-item-shortcut-' + item.label"
                >{{ item.shortcut }}</span
            >
        </a>
    </ng-template>
</p-menu>
