<div
    class="flex flex-col gap-4"
    [class]="styleClass()"
    data-testid="master-layout-root"
>
    <p-button
        *ngIf="showBack()"
        icon="pi pi-arrow-left"
        label="{{ 'common.back' | translate }}"
        (click)="goBack()"
        severity="primary"
        outlined
        data-testid="master-layout-back"
    ></p-button>

    <div
        class="border-b-neutral flex items-baseline justify-between pb-1"
        data-testid="master-layout-header"
    >
        <h6 class="text-primary">
            {{ title() | translate }}
        </h6>
        <ng-content select="[actions]"></ng-content>
    </div>

    <ng-content
        select="[subtitle]"
        data-testid="master-layout-subtitle"
    ></ng-content>

    <ng-content data-testid="master-layout-content"></ng-content>
</div>
