<div
    class="max-w-sm space-y-4 p-4 sm:max-w-md md:min-w-[500px]"
    data-testid="enterprise-new-activity-record-dialog-root"
>
    <div class="flex items-center justify-between">
        <h2 class="text-xl font-semibold">
            {{ 'enterprise.emission.activity.record.new' | translate }}
        </h2>
        <p-button
            icon="pi pi-times"
            text
            rounded
            (click)="onCancel()"
            data-testid="enterprise-new-activity-record-dialog-close"
        ></p-button>
    </div>
    <div class="grid grid-cols-1 gap-2">
        <p-iftalabel class="col-span-1 my-2">
            <input
                pInputText
                [value]="getFactorName()"
                class="w-full"
                [disabled]="true"
                data-testid="enterprise-new-activity-record-dialog-factor"
            />
            <label>{{ 'enterprise.emission.activity.record.table.factor' | translate }}</label>
        </p-iftalabel>
        <p-iftalabel class="col-span-1 my-2">
            <input
                pInputText
                class="w-full"
                [value]="getSourceName()"
                id="sourceName"
                disabled
                data-testid="enterprise-new-activity-record-dialog-source"
            />
            <label for="sourceName">{{ 'enterprise.emission.activity.record.table.source' | translate }}</label>
        </p-iftalabel>
    </div>

    <form
        [formGroup]="formGroup"
        (ngSubmit)="submit()"
        class="grid grid-cols-1 gap-4 md:grid-cols-1"
        data-testid="enterprise-new-activity-record-dialog-form"
    >
        <p-iftalabel>
            <p-select
                [options]="selectableAssets"
                formControlName="assetId"
                [filter]="true"
                filterBy="label"
                optionLabel="label"
                optionValue="value"
                class="w-full"
                [showClear]="true"
                [appendTo]="'body'"
                [panelStyle]="{'min-width': '100%'}"
                data-testid="enterprise-new-activity-record-dialog-asset"
            />
            <label>{{ 'enterprise.emission.activity.record.table.asset' | translate }}</label>
        </p-iftalabel>
        <p-iftalabel class="my-2">
            <p-inputnumber
                formControlName="quantity"
                class="w-full"
                [min]="0"
                [attr.data-testid]="'enterprise-new-activity-record-dialog-quantity'"
            >
            </p-inputnumber>
            <label>{{ 'enterprise.emission.activity.record.table.quantity' | translate }}</label>
        </p-iftalabel>
        <p-iftalabel class="my-2">
            <p-dropdown
                formControlName="unit"
                [options]="unitOptions"
                class="w-full break-words"
                [placeholder]="'enterprise.emission.activity.record.table.unit' | translate"
                data-testid="enterprise-new-activity-record-dialog-unit"
            ></p-dropdown>
            <label>{{ 'enterprise.emission.activity.record.table.unit' | translate }}</label>
        </p-iftalabel>

        <p-iftalabel class="my-2">
            <p-inputnumber
                formControlName="value"
                class="w-full"
                [min]="0"
                [attr.data-testid]="'enterprise-new-activity-record-dialog-value'"
            >
            </p-inputnumber>
            <label>{{ 'enterprise.emission.activity.record.table.value' | translate }}</label>
        </p-iftalabel>

        <p-fileUpload
            mode="basic"
            chooseLabel="{{ 'enterprise.emission.activity.record.table.file.choose' | translate }}"
            [auto]="false"
            accept="image/*,application/pdf"
            (onSelect)="onFileSelect($event)"
            [disabled]="formGroupDisable"
            data-testid="enterprise-new-activity-record-dialog-file"
        ></p-fileUpload>
        <p
            *ngIf="data?.editRecord?.file && selectedFile === null"
            class="cursor-pointer text-center text-primary hover:underline"
            data-testid="enterprise-new-activity-record-dialog-file-download"
        >
            <a (click)="onDownloadFile()">
                {{ data?.editRecord?.file?.fileName }}
            </a>
        </p>
        <p-iftalabel class="my-2">
            <p-date-picker
                class="w-full"
                formControlName="rangeDates"
                selectionMode="range"
                [readonlyInput]="true"
                [style]="{width: '100%'}"
                [inline]="true"
                [maxDate]="maxDate"
                [disabledDates]="disabledDates"
                [selectOtherMonths]="true"
                data-testid="enterprise-new-activity-record-dialog-dates"
            >
            </p-date-picker>
            <label>{{ 'enterprise.emission.activity.record.table.dateRange' | translate }}</label>
        </p-iftalabel>

        <div class="flex justify-between">
            <p-button
                type="button"
                (click)="onCancel()"
                outlined="true"
                [label]="'common.cancel' | translate"
                data-testid="enterprise-new-activity-record-dialog-cancel"
            ></p-button>
            <p-button
                type="submit"
                [label]="'common.save' | translate"
                [disabled]="formGroup.invalid || formGroupDisable"
                data-testid="enterprise-new-activity-record-dialog-save"
            ></p-button>
        </div>
    </form>
</div>
