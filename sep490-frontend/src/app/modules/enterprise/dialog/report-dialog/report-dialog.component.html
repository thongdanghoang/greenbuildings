<p-stepper
    [value]="1"
    class="block max-w-sm sm:max-w-md md:min-w-[500px]"
    data-testid="report-dialog-root"
>
    <p-step-panels class="block h-full">
        <p-step-panel [value]="1">
            <ng-template
                #content
                let-activateCallback="activateCallback"
            >
                <p data-testid="report-dialog-step1-title">
                    {{ 'enterprise.emission.activity.selectGroups' | translate }}
                </p>
                <form
                    [formGroup]="formGroup"
                    data-testid="report-dialog-step1-form"
                >
                    <div class="my-4 grid grid-cols-2 gap-4">
                        <div
                            *ngFor="let activity of groups"
                            class="flex items-center"
                            data-testid="report-dialog-group-item"
                        >
                            <p-checkbox
                                [formControlName]="'selectedGroups'"
                                [value]="activity.id"
                                [inputId]="'activity-' + activity.id"
                            />
                            <label
                                [for]="'activity-' + activity.id"
                                class="ml-2"
                            >
                                {{ activity.name | translate }}
                                <span
                                    *ngIf="activity.description"
                                    class="block text-sm text-gray-500"
                                >
                                    {{ activity.description }}
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <p-button
                            label="{{ 'common.next' | translate }}"
                            icon="pi pi-arrow-right"
                            iconPos="right"
                            [disabled]="formStructure.selectedGroups.value!.length === 0"
                            (onClick)="activateCallback(2)"
                            data-testid="report-dialog-next"
                        ></p-button>
                    </div>
                </form>
            </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
            <ng-template
                #content
                let-activateCallback="activateCallback"
            >
                <form
                    [formGroup]="formGroup"
                    data-testid="report-dialog-step2-form"
                >
                    <p-iftalabel class="my-2">
                        <p-date-picker
                            formControlName="rangeDates"
                            class="w-full"
                            selectionMode="range"
                            [style]="{width: '100%'}"
                            [inline]="true"
                            data-testid="report-dialog-date-range"
                        ></p-date-picker>
                        <label>{{ 'enterprise.emission.activity.record.table.dateRange' | translate }}</label>
                    </p-iftalabel>
                    <div class="flex justify-between">
                        <p-button
                            label="{{ 'common.back' | translate }}"
                            severity="secondary"
                            icon="pi pi-arrow-left"
                            (onClick)="activateCallback(1)"
                            data-testid="report-dialog-back"
                        ></p-button>
                        <p-button
                            label="{{ 'common.download' | translate }}"
                            icon="pi pi-download"
                            severity="primary"
                            [disabled]="formGroup.invalid"
                            (onClick)="submit()"
                            data-testid="report-dialog-download"
                        ></p-button>
                    </div>
                </form>
            </ng-template>
        </p-step-panel>
    </p-step-panels>
</p-stepper>
