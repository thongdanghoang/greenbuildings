<div
    *ngIf="enterprise"
    data-testid="enterprise-detail-dialog-root"
>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <div>
            <h2
                class="mb-4 text-xl font-semibold text-primary"
                data-testid="enterprise-detail-dialog-title"
            >
                {{ 'enterprise.create.title' | translate }}
            </h2>
            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.name"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-name"
                />
                <label>{{ 'enterprise.create.name' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.enterpriseEmail"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-email"
                />
                <label>{{ 'enterprise.create.email' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.hotline"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-hotline"
                />
                <label>{{ 'enterprise.create.hotline' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.address"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-address"
                />
                <label>{{ 'enterprise.create.address' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.taxCode"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-tax-code"
                />
                <label>{{ 'enterprise.create.taxCode' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel
                class="my-2 block cursor-pointer"
                (click)="openLicenseUrl()"
            >
                <input
                    pInputText
                    [value]="enterprise.businessLicenseImageUrl"
                    class="w-full cursor-pointer text-primary"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-license"
                />
                <label
                    >{{ 'enterprise.create.businessLicenseImageUrl' | translate }}
                    <i class="pi pi-cloud-download text-sm"></i
                ></label>
            </p-iftalabel>
        </div>

        <div>
            <h2 class="mb-4 text-xl font-semibold text-primary">
                {{ 'enterprise.create.representative' | translate }}
            </h2>
            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.representativeName"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-representative-name"
                />
                <label>{{ 'enterprise.create.representativeName' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.representativePosition"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-representative-position"
                />
                <label>{{ 'enterprise.create.representativePosition' | translate }}</label>
            </p-iftalabel>

            <p-iftalabel class="my-2 block">
                <input
                    pInputText
                    [(ngModel)]="enterprise.representativeContact"
                    class="w-full"
                    readonly
                    autocomplete="off"
                    data-testid="enterprise-detail-dialog-representative-contact"
                />
                <label>{{ 'enterprise.create.representativeContact' | translate }}</label>
            </p-iftalabel>
        </div>
    </div>

    <div class="mt-6 flex justify-end">
        <p-button
            label="{{ 'common.cancel' | translate }}"
            styleClass="p-button-secondary"
            (onClick)="this.close()"
            data-testid="enterprise-detail-dialog-close"
        ></p-button>
    </div>
</div>
