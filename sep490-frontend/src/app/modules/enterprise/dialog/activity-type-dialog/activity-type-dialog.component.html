<!-- activity-type-dialog.component.html -->
<div
    class="mt-4 w-[300px] sm:w-[400px] md:w-[500px]"
    data-testid="activity-type-dialog-root"
>
    <!-- Dialog Header -->
    <div
        class="p-dialog-header border-b p-0"
        data-testid="activity-type-dialog-header"
    >
        <span class="text-xl font-semibold">
            {{ 'enterprise.type.name' | translate }}
        </span>
        <button
            pButton
            type="button"
            icon="pi pi-times"
            class="p-button-rounded p-button-text"
            (click)="closeDialog()"
            data-testid="activity-type-dialog-close"
        ></button>
    </div>

    <!-- Form Content -->
    <div class="p-dialog-content flex min-h-[150px] flex-col overflow-hidden p-0">
        <form
            [formGroup]="formGroup"
            data-testid="activity-type-dialog-form"
        >
            <p-iftalabel
                class="my-2"
                errorMessages
            >
                <input
                    pInputText
                    formControlName="name"
                    class="w-full"
                    autocomplete="off"
                    data-testid="activity-type-dialog-name"
                />
                <label>{{ 'common.name' | translate }}</label>
                <form-field-error></form-field-error>
            </p-iftalabel>
            <p-iftalabel
                class="my-2"
                errorMessages
            >
                <input
                    pInputText
                    formControlName="description"
                    class="w-full"
                    autocomplete="off"
                    data-testid="activity-type-dialog-description"
                />
                <label>{{ 'admin.emissionFactor.description' | translate }}</label>
                <form-field-error></form-field-error>
            </p-iftalabel>
        </form>
        <div class="mt-2 flex justify-end">
            <p-button
                label="{{ 'common.save' | translate }}"
                icon="pi pi-check"
                severity="primary"
                [disabled]="formGroup.invalid"
                (onClick)="submit()"
                data-testid="activity-type-dialog-save"
            ></p-button>
        </div>
    </div>
</div>
