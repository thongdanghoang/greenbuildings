<master-layout
    title="enterprise.buildings.commonActivity.title"
    [showBack]="true"
    data-testid="manage-common-activity-root"
>
    <div
        subtitle
        data-testid="manage-common-activity-subtitle"
    >
        {{ 'enterprise.buildings.commonActivity.description' | translate }}
    </div>

    <div
        actions
        data-testid="manage-common-activity-actions"
    >
        <p-button
            label="{{ 'buildingGroup.enterprise.emission.activity.new' | translate }}"
            icon="pi pi-plus"
            severity="primary"
            (onClick)="openNewActivityDialog()"
            data-testid="manage-common-activity-new"
        ></p-button>
    </div>

    <table-template
        [fetch]="fetchActivity"
        [columns]="cols"
        [searchOnInit]="false"
        [captionTemplateRef]="captionTemplateRef"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        [triggerClearSelected]="clearSelectedEvent"
        (selectionChange)="onSelectionChange($event)"
        [checkbox]="true"
        data-testid="manage-common-activity-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex flex-col items-end justify-between gap-2 lg:flex-row lg:items-center"
        data-testid="manage-common-activity-search"
    >
        <p-inputgroup class="max-w-96">
            <input
                type="text"
                pInputText
                [(ngModel)]="searchCriteria.name"
                placeholder="{{ 'common.search' | translate }}"
                (keydown.enter)="searchEvent.emit()"
                data-testid="manage-common-activity-search-input"
            />
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-search"
                    severity="secondary"
                    variant="text"
                    (onClick)="searchEvent.emit()"
                    data-testid="manage-common-activity-search-button"
                />
            </p-inputgroup-addon>
        </p-inputgroup>

        <p-button
            severity="danger"
            [label]="
                selected.length
                    ? ('enterprise.emission.activity.deleteWithCount' | translate: {count: selected.length})
                    : ('enterprise.Users.delete' | translate)
            "
            icon="pi pi-trash"
            outlined
            [disabled]="!selected || !selected.length"
            (onClick)="confirmDelete()"
            data-testid="manage-common-activity-delete"
        />
    </div>
</ng-template>
<ng-template
    #actionsTemplate
    let-activity
>
    <p-button
        icon="pi pi-pencil"
        [rounded]="true"
        [text]="true"
        severity="contrast"
        (onClick)="openActivityDetailsDialog(activity)"
        data-testid="manage-common-activity-edit"
    />
</ng-template>
<ng-template
    #typeTemplate
    let-activity
>
    <span
        *ngIf="activity.type"
        data-testid="manage-common-activity-type"
        >{{ activity?.type.name }}</span
    >
</ng-template>
<ng-template
    #factorNameTemplate
    let-activity
>
    <span
        *ngIf="activity.emissionFactor"
        data-testid="manage-common-activity-factor"
        >{{ getFactorName(activity) }}</span
    >
</ng-template>
