<master-layout
    title="assets.title"
    data-testid="assets-view-root"
>
    <div
        actions
        data-testid="assets-view-actions"
    >
        <ng-container
            *ngTemplateOutlet="addAssetsBtn; context: {styleClass: 'block lg:hidden', mobile: true}"
        ></ng-container>
        <ng-container
            *ngTemplateOutlet="addAssetsBtn; context: {styleClass: 'hidden lg:block', mobile: false}"
        ></ng-container>
    </div>

    <table-template
        [fetch]="search"
        [columns]="cols"
        [triggerSearch]="searchEvent"
        [captionTemplateRef]="captionTemplateRef"
        [criteria]="criteria"
        data-testid="assets-view-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <form
        [formGroup]="filterFormGroup"
        data-testid="assets-view-filters"
    >
        <div class="-mx-4 grid grid-cols-4 gap-2.5 lg:mx-0">
            <p-iconfield class="col-span-4 *:w-full lg:col-span-1">
                <p-inputicon styleClass="pi pi-search" />
                <input
                    (keydown.enter)="onFilter()"
                    type="text"
                    pInputText
                    formControlName="keyword"
                    placeholder="{{ 'assets.table.filters.keyword' | translate }}"
                    data-testid="assets-view-filter-keyword"
                />
            </p-iconfield>
            <div class="col-span-4 *:w-full lg:col-span-1">
                <p-multiselect
                    [options]="selectableBuildings"
                    formControlName="buildings"
                    optionLabel="label"
                    placeholder="{{ 'assets.table.filters.buildings' | translate }}"
                    [maxSelectedLabels]="1"
                    optionValue="value"
                    data-testid="assets-view-filter-buildings"
                >
                </p-multiselect>
            </div>
            <div class="col-span-4 *:w-full lg:col-span-2">
                <div class="col-span-4 flex w-full justify-end gap-2.5">
                    <p-button
                        severity="danger"
                        [label]="'common.revert' | translate"
                        icon="pi pi-times"
                        outlined
                        (onClick)="onResetFilters()"
                        data-testid="assets-view-filter-reset"
                    />
                    <p-button
                        severity="primary"
                        [label]="'common.search' | translate"
                        icon="pi pi-search"
                        outlined
                        (onClick)="onFilter()"
                        data-testid="assets-view-filter-search"
                    />
                </div>
            </div>
        </div>
    </form>
</ng-template>

<ng-template
    #addAssetsBtn
    let-styleClass="styleClass"
    let-mobile="mobile"
>
    <p-button
        [class]="styleClass"
        [label]="mobile ? '' : ('assets.btn.new' | translate)"
        icon="pi pi-plus"
        severity="primary"
        (onClick)="openNewAssetDialog()"
        data-testid="assets-view-add"
    ></p-button>
</ng-template>

<ng-template
    #buildingTemplate
    let-rowData
>
    {{ rowData.building?.name }}
</ng-template>

<ng-template
    #assetColActions
    let-rowData
>
    <div
        class="flex"
        data-testid="assets-view-row-actions"
    >
        <p-button
            icon="pi pi-pencil"
            text
            severity="contrast"
            (onClick)="openEditAsset(rowData.id)"
            data-testid="assets-view-action-edit"
        />
        <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            (onClick)="onDeleteAsset(rowData.id)"
            data-testid="assets-view-action-delete"
        />
    </div>
</ng-template>
