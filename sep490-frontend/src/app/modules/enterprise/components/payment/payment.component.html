<master-layout
    title="payment.history.credit.title"
    data-testid="enterprise-payment-root"
>
    <div
        actions
        data-testid="enterprise-payment-actions"
    >
        <p-button
            (onClick)="navigateToSubscription()"
            severity="primary"
            [label]="'payment.history.button.buyCredit' | translate"
            outlined
            data-testid="enterprise-payment-buy-credit"
        />
    </div>

    <div
        class="flex flex-col items-center justify-center gap-2.5 pl-0 lg:flex-row lg:justify-between lg:px-10"
        data-testid="enterprise-payment-balance-section"
    >
        <div class="my-4 flex flex-col items-center gap-6 lg:items-start">
            <div class="flex flex-col items-center gap-2.5 text-center lg:flex-row lg:items-end lg:text-left">
                <p>
                    {{ 'payment.history.balance' | translate }}
                </p>
                <span
                    class="text-3xl text-primary"
                    data-testid="enterprise-payment-balance"
                    >{{ balance | number: '1.0-0' }}</span
                >
            </div>
            <span class="flex items-center text-center">{{ 'payment.history.credit.label' | translate }}</span>
        </div>
    </div>
    <table-template
        [fetch]="fetchData"
        [columns]="cols"
        [criteria]="paymentCriteria"
        [captionTemplateRef]="captionTemplateRef"
        [sort]="sort"
        [triggerSearch]="triggerSearch"
        (selectionChange)="onSelectionChange($event)"
        data-testid="enterprise-payment-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex items-center justify-start"
        data-testid="enterprise-payment-caption"
    >
        <span class="font-bold text-primary">{{ 'payment.history.title' | translate }}</span>
    </div>
</ng-template>
<ng-template
    #actionsTemplate
    let-product
>
    <p-button
        icon="pi pi-eye"
        [rounded]="true"
        [text]="true"
        severity="contrast"
        (onClick)="onViewDetail(product)"
        data-testid="enterprise-payment-view-detail"
    />
</ng-template>

<ng-template
    #statusTemplate
    let-rowData
>
    <p-tag
        [ngClass]="'font-medium ' + getStatusClass(rowData.status)"
        [value]="'enum.status.payment.' + rowData.status | translate"
        data-testid="enterprise-payment-status"
    />
</ng-template>

<ng-template
    #amountTemplate
    let-rowData
>
    <p data-testid="enterprise-payment-credits">+{{ rowData.numberOfCredits }}</p>
</ng-template>
