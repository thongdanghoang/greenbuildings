<master-layout
    title="enterprise.type.name"
    [showBack]="true"
    data-testid="enterprise-activity-type-root"
>
    <div
        subtitle
        data-testid="enterprise-activity-type-subtitle"
    >
        {{ 'enterprise.type.description' | translate }}
    </div>

    <table-template
        [fetch]="fetchActivityTypes"
        [columns]="cols"
        [criteria]="searchCriteria"
        [searchOnInit]="true"
        [triggerSearch]="searchEvent"
        [triggerClearSelected]="clearSelectedEvent"
        [captionTemplateRef]="captionTemplateRef"
        [checkbox]="true"
        (selectionChange)="onSelectionChange($event)"
        data-testid="enterprise-activity-type-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex items-center justify-between"
        data-testid="enterprise-activity-type-search"
    >
        <div class="flex gap-2.5">
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input
                    [(ngModel)]="searchCriteria.name"
                    type="text"
                    pInputText
                    placeholder="{{ 'common.search' | translate }}"
                    (keydown.enter)="searchEvent.emit()"
                    data-testid="enterprise-activity-type-search-input"
                />
            </p-iconfield>
            <p-button
                severity="primary"
                [label]="'enterprise.Users.search' | translate"
                icon="pi pi-search"
                outlined
                (onClick)="searchEvent.emit()"
                data-testid="enterprise-activity-type-search-button"
            />
        </div>
        <div class="flex gap-2.5">
            <p-button
                severity="danger"
                [label]="
                    selected.length
                        ? ('enterprise.type.deleteWithCount' | translate: {count: selected.length})
                        : ('enterprise.Users.delete' | translate)
                "
                icon="pi pi-trash"
                outlined
                [disabled]="!selected || !selected.length"
                (onClick)="confirmDelete()"
                data-testid="enterprise-activity-type-delete"
            />
            <p-button
                severity="primary"
                [label]="'enterprise.type.add' | translate"
                icon="pi pi-user-plus"
                outlined
                (onClick)="addActivityType()"
                data-testid="enterprise-activity-type-add"
            />
        </div>
    </div>
</ng-template>
<ng-template
    #actionsTemplate
    let-rowData
>
    <div
        class="flex"
        data-testid="enterprise-activity-type-row-actions"
    >
        <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="info"
            (onClick)="onEdit(rowData)"
            data-testid="enterprise-activity-type-edit"
        />
        <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            (onClick)="onDelete(rowData)"
            data-testid="enterprise-activity-type-row-delete"
        />
    </div>
</ng-template>
