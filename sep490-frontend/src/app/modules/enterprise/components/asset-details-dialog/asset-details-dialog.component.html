<div
    class="mt-4"
    data-testid="asset-details-dialog-spacer"
></div>
<master-layout
    [title]="formStructure.id.value ? 'assets.details.dialog.title.edit' : 'assets.details.dialog.title.new'"
    data-testid="asset-details-dialog-root"
>
    <p-button
        actions
        icon="pi pi-times"
        text
        rounded
        (click)="onclose()"
        data-testid="asset-details-dialog-close"
    ></p-button>

    <ng-container *ngTemplateOutlet="assetDetailsForm"></ng-container>
</master-layout>

<ng-template #assetDetailsForm>
    <form
        [formGroup]="formGroup"
        (ngSubmit)="submit()"
        class="grid w-80 grid-cols-1 sm:w-96 md:grid-cols-1"
        data-testid="asset-details-dialog-form"
    >
        <p-iftalabel class="mb-6">
            <p-select
                [options]="selectableBuildings"
                formControlName="buildingId"
                optionLabel="label"
                optionValue="value"
                class="w-full"
                [showClear]="true"
                data-testid="asset-details-dialog-building"
            />
            <label>{{ 'assets.details.dialog.building' | translate }}</label>
        </p-iftalabel>
        <p-iftalabel errorMessages>
            <input
                pInputText
                formControlName="name"
                class="w-full"
                data-testid="asset-details-dialog-name"
            />
            <label>{{ 'assets.details.dialog.name' | translate }}</label>
            <form-field-error />
        </p-iftalabel>
        <p-iftalabel errorMessages>
            <input
                pInputText
                formControlName="code"
                class="w-full"
                data-testid="asset-details-dialog-code"
            />
            <label>{{ 'assets.details.dialog.code' | translate }}</label>
            <form-field-error />
        </p-iftalabel>
        <p-iftalabel errorMessages>
            <textarea
                rows="5"
                cols="30"
                pTextarea
                formControlName="description"
                class="w-full"
                data-testid="asset-details-dialog-description"
            ></textarea>
            <label>{{ 'assets.details.dialog.description' | translate }}</label>
            <form-field-error />
        </p-iftalabel>
        <div class="flex justify-end gap-4">
            <p-button
                label="{{ 'common.back' | translate }}"
                severity="secondary"
                icon="pi pi-arrow-left"
                (onClick)="onclose()"
                data-testid="asset-details-dialog-back"
            ></p-button>
            <p-button
                label="{{ 'common.save' | translate }}"
                icon="pi pi-check"
                severity="primary"
                (onClick)="submit()"
                data-testid="asset-details-dialog-save"
            ></p-button>
        </div>
    </form>
</ng-template>
