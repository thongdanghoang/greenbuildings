<master-layout
    title="sentInvitation.title"
    data-testid="enterprise-sent-invitation-root"
>
    <p
        subtitle
        data-testid="enterprise-sent-invitation-subtitle"
    >
        {{ 'sentInvitation.description' | translate }}
    </p>

    <table-template
        [fetch]="fetchInvitations"
        [columns]="cols"
        [searchOnInit]="true"
        [captionTemplateRef]="captionTemplateRef"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        data-testid="enterprise-sent-invitation-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="-mx-4 grid grid-cols-3 gap-2.5 lg:mx-0"
        data-testid="enterprise-sent-invitation-filters"
    >
        <p-iconfield class="col-span-3 *:w-full lg:col-span-1">
            <p-inputicon styleClass="pi pi-search" />
            <input
                type="text"
                pInputText
                [(ngModel)]="searchCriteria.tenantEmail"
                placeholder="{{ 'sentInvitation.table.email' | translate }}"
                data-testid="enterprise-sent-invitation-filter-email"
            />
        </p-iconfield>
        <p-select
            class="col-span-3 lg:col-span-1"
            [options]="availableBuildings"
            [filter]="true"
            showClear="true"
            (onChange)="onSelectBuilding($event)"
            (onClear)="onSelectBuilding($event)"
            filterBy="label"
            [(ngModel)]="searchCriteria.buildingId"
            optionLabel="label"
            optionValue="value"
            [placeholder]="'sentInvitation.table.selectBuilding' | translate"
            data-testid="enterprise-sent-invitation-filter-building"
        />
        <p-select
            class="col-span-3 lg:col-span-1"
            [options]="matchingGroups"
            [filter]="true"
            showClear="true"
            filterBy="name"
            [(ngModel)]="searchCriteria.buildingGroupId"
            optionLabel="name"
            optionValue="id"
            [placeholder]="'sentInvitation.table.selectBuildingGroup' | translate"
            data-testid="enterprise-sent-invitation-filter-group"
        />
        <div class="col-span-3 flex w-full justify-end gap-2.5">
            <p-button
                severity="danger"
                [label]="'common.revert' | translate"
                icon="pi pi-times"
                outlined
                (onClick)="clearCriteria()"
                data-testid="enterprise-sent-invitation-reset"
            />
            <p-button
                severity="primary"
                [label]="'enterprise.Users.search' | translate"
                icon="pi pi-search"
                outlined
                (onClick)="searchEvent.emit()"
                data-testid="enterprise-sent-invitation-search"
            />
        </div>
    </div>
</ng-template>

<ng-template
    #buildingNameTemplate
    let-invitation
>
    <span data-testid="enterprise-sent-invitation-building">{{ invitation?.buildingGroup.building.name }}</span>
</ng-template>

<ng-template
    #buildingGroupNameTemplate
    let-invitation
>
    <span data-testid="enterprise-sent-invitation-group">{{ invitation?.buildingGroup.name }}</span>
</ng-template>

<ng-template
    #invitationStatusTemplate
    let-rowData
>
    <p-tag
        [ngClass]="'font-medium ' + getStatusClass(rowData.status)"
        [value]="'enum.invitation.status.' + rowData.status | translate"
        data-testid="enterprise-sent-invitation-status"
    />
</ng-template>
<ng-template
    #actionsTemplate
    let-rowData
>
    <p-button
        *ngIf="rowData.status === InvitationStatus.PENDING"
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        severity="danger"
        (onClick)="onRejectInvitation(rowData)"
        data-testid="enterprise-sent-invitation-reject"
    />
</ng-template>
