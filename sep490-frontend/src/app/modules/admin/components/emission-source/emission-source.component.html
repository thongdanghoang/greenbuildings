<master-layout
    title="admin.emissionSource.name"
    data-testid="admin-emission-source-root"
>
    <div
        subtitle
        data-testid="admin-emission-source-subtitle"
    >
        {{ 'admin.emissionSource.description' | translate }}
    </div>
    <p-button
        actions
        severity="primary"
        [label]="'admin.emissionSource.addEmissionSource' | translate"
        icon="pi pi-user-plus"
        outlined
        (onClick)="addEmissionSource()"
        data-testid="admin-emission-source-add"
    />
    <!--    <div class="my-2 flex items-center justify-center">-->
    <!--        <h3 class="mb-2 font-semibold text-primary">-->
    <!--            {{ 'admin.emissionSource.upload.title' | translate }}-->
    <!--        </h3>-->
    <!-- import.component.html -->
    <!--    </div>-->
    <table-template
        [fetch]="fetchEmissionSource"
        [columns]="cols"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        [captionTemplateRef]="captionTemplateRef"
        [checkbox]="true"
        (selectionChange)="onSelectionChange($event)"
        data-testid="admin-emission-source-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="-mx-4 flex flex-col-reverse items-end justify-between gap-2 *:w-full lg:flex-row lg:items-center"
        data-testid="admin-emission-source-search"
    >
        <p-inputgroup>
            <input
                [(ngModel)]="searchCriteria.criteria"
                type="text"
                pInputText
                placeholder="{{ 'common.search' | translate }}"
                (keydown.enter)="search()"
                data-testid="admin-emission-source-search-input"
            />
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-search"
                    severity="secondary"
                    text
                    (onClick)="searchEvent.emit()"
                    data-testid="admin-emission-source-search-button"
                />
            </p-inputgroup-addon>
        </p-inputgroup>
        <div
            class="flex justify-between gap-2 lg:justify-end"
            data-testid="admin-emission-source-actions"
        >
            <!-- buttons omitted -->
            <p-fileUpload
                name="file"
                accept=".xlsx"
                mode="basic"
                chooseIcon="pi pi-upload"
                [customUpload]="true"
                (uploadHandler)="uploadExcel($event)"
                [chooseLabel]="'admin.emissionSource.upload.chooseFile' | translate"
                [auto]="true"
                [maxFileSize]="5000000"
                data-testid="admin-emission-source-upload"
            >
            </p-fileUpload>
            <p-button
                severity="secondary"
                [label]="'admin.emissionSource.downloadFile' | translate"
                icon="pi pi-download"
                outlined
                (onClick)="onDownloadFile()"
                size="small"
                data-testid="admin-emission-source-download"
            />
        </div>
    </div>
</ng-template>

<ng-template
    #actionsTemplate
    let-rowData
>
    <div
        class="flex"
        data-testid="admin-emission-source-row-actions"
    >
        <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="info"
            (onClick)="onEdit(rowData)"
            data-testid="admin-emission-source-edit"
        />
    </div>
</ng-template>
