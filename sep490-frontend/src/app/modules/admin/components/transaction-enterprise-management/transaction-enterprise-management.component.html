<master-layout
    title="sidebar.admin.transaction"
    data-testid="admin-transaction-enterprise-root"
>
    <!-- Table -->
    <table-template
        [fetch]="fetchTransaction"
        [columns]="cols"
        [sort]="undefined"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        [triggerClearSelected]="clearSelectedEvent"
        [captionTemplateRef]="captionTemplateRef"
        (selectionChange)="onSelectionChange($event)"
        data-testid="admin-transaction-enterprise-table"
    ></table-template>
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex flex-col items-end justify-between gap-2 lg:flex-row lg:items-center"
        data-testid="admin-transaction-enterprise-search"
    >
        <p-inputgroup class="max-w-96">
            <input
                [(ngModel)]="searchCriteria.criteria"
                type="text"
                pInputText
                placeholder="{{ 'common.search' | translate }}"
                (keydown.enter)="search()"
                data-testid="admin-transaction-enterprise-search-input"
            />
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-search"
                    severity="secondary"
                    text
                    (onClick)="search()"
                    data-testid="admin-transaction-enterprise-search-button"
                />
            </p-inputgroup-addon>
        </p-inputgroup>
    </div>
</ng-template>

<ng-template
    #typeTemplate
    let-rowData
>
    <p data-testid="admin-transaction-enterprise-type">
        {{ 'useCreditHistory.table.' + rowData.transactionType | translate }}
    </p>
</ng-template>
