<master-layout
    title="sidebar.admin.payment"
    data-testid="admin-payment-enterprise-root"
>
    <!-- Table -->
    <table-template
        [fetch]="fetchPayments"
        [columns]="cols"
        [sort]="undefined"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        [triggerClearSelected]="clearSelectedEvent"
        [captionTemplateRef]="captionTemplateRef"
        (selectionChange)="onSelectionChange($event)"
        data-testid="admin-payment-enterprise-table"
    ></table-template>
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex flex-col items-end justify-between gap-2 lg:flex-row lg:items-center"
        data-testid="admin-payment-enterprise-search"
    >
        <p-inputgroup class="max-w-96">
            <input
                [(ngModel)]="searchCriteria.criteria"
                type="text"
                pInputText
                placeholder="{{ 'common.search' | translate }}"
                (keydown.enter)="search()"
                data-testid="admin-payment-enterprise-search-input"
            />
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-search"
                    severity="secondary"
                    text
                    (onClick)="search()"
                    data-testid="admin-payment-enterprise-search-button"
                />
            </p-inputgroup-addon>
        </p-inputgroup>
    </div>
</ng-template>

<ng-template
    #statusTemplate
    let-rowData
>
    <p-tag
        [ngClass]="'font-medium ' + getStatusClass(rowData.status)"
        [value]="'enum.status.payment.' + rowData.status | translate"
        data-testid="admin-payment-enterprise-status"
    />
</ng-template>

<ng-template
    #amountTemplate
    let-rowData
>
    <p data-testid="admin-payment-enterprise-credits">+{{ rowData.numberOfCredits }}</p>
</ng-template>
