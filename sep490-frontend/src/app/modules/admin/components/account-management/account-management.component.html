<master-layout
    title="sidebar.admin.accountManagement"
    data-testid="account-management-root"
>
    <div
        subtitle
        data-testid="account-management-subtitle"
    >
        {{ 'admin.account.description' | translate }}
    </div>

    <table-template
        [fetch]="fetchUsers"
        [columns]="cols"
        [sort]="undefined"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        [captionTemplateRef]="captionTemplateRef"
        [checkbox]="false"
        (selectionChange)="onSelectionChange($event)"
        data-testid="account-management-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex flex-col items-end justify-between gap-2 lg:flex-row lg:items-center"
        data-testid="account-management-search"
    >
        <p-inputgroup
            class="max-w-96"
            data-testid="account-management-search-input-group"
        >
            <input
                [(ngModel)]="searchCriteria.criteria"
                type="text"
                pInputText
                placeholder="{{ 'common.search' | translate }}"
                (keydown.enter)="search()"
                data-testid="account-management-search-input"
            />
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-search"
                    severity="secondary"
                    text
                    (onClick)="searchEvent.emit()"
                    data-testid="account-management-search-button"
                />
            </p-inputgroup-addon>
        </p-inputgroup>
    </div>
</ng-template>
<ng-template
    #roleTemplate
    let-data
>
    <p data-testid="account-management-role">{{ 'enum.role.' + data.role | translate }}</p>
</ng-template>
<ng-template
    #emailVerifiedTemplate
    let-data
>
    <span
        *ngIf="data.emailVerified"
        class="text-green-500"
        data-testid="account-management-email-verified"
    >
        <i class="pi pi-check-circle"></i>
        {{ 'common.accept' | translate }}
    </span>
    <span
        *ngIf="!data.emailVerified"
        class="text-red-500"
        data-testid="account-management-email-not-verified"
    >
        <i class="pi pi-times-circle"></i>
        {{ 'common.reject' | translate }}
    </span>
</ng-template>
