<master-layout
    title="sidebar.admin.chemicalDensity"
    data-testid="admin-chemical-density-root"
>
    <div
        subtitle
        data-testid="admin-chemical-density-subtitle"
    >
        {{ 'admin.chemicalDensity.description' | translate }}
    </div>
    <table-template
        [fetch]="fetchUsers"
        [columns]="cols"
        [sort]="undefined"
        [criteria]="searchCriteria"
        [triggerSearch]="searchEvent"
        [triggerClearSelected]="clearSelectedEvent"
        [captionTemplateRef]="captionTemplateRef"
        [checkbox]="true"
        (selectionChange)="onSelectionChange($event)"
        data-testid="admin-chemical-density-table"
    />
</master-layout>

<ng-template #captionTemplateRef>
    <div
        class="flex flex-col items-end justify-between gap-2 lg:flex-row lg:items-center"
        data-testid="admin-chemical-density-search"
    >
        <p-inputgroup class="max-w-96">
            <input
                [(ngModel)]="searchCriteria.criteria"
                type="text"
                pInputText
                placeholder="{{ 'common.search' | translate }}"
                (keydown.enter)="search()"
                data-testid="admin-chemical-density-search-input"
            />
            <p-inputgroup-addon>
                <p-button
                    icon="pi pi-search"
                    severity="secondary"
                    text
                    (onClick)="search()"
                    data-testid="admin-chemical-density-search-button"
                />
            </p-inputgroup-addon>
        </p-inputgroup>
        <div
            class="flex gap-2.5"
            data-testid="admin-chemical-density-actions"
        >
            <p-button
                severity="danger"
                [label]="
                    selected.length
                        ? ('enterprise.type.deleteWithCount' | translate: {count: selected.length})
                        : ('enterprise.Users.delete' | translate)
                "
                icon="pi pi-trash"
                outlined
                [disabled]="!selected || !selected.length"
                (onClick)="confirmDelete()"
                data-testid="admin-chemical-density-delete"
            />
            <p-button
                severity="primary"
                [label]="'admin.chemicalDensity.add' | translate"
                icon="pi pi-user-plus"
                outlined
                (onClick)="addEmissionSource()"
                data-testid="admin-chemical-density-add"
            />
        </div>
    </div>
</ng-template>
<ng-template
    #actionsTemplate
    let-rowData
>
    <div
        class="flex"
        data-testid="admin-chemical-density-row-actions"
    >
        <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="info"
            (onClick)="onEdit(rowData)"
            data-testid="admin-chemical-density-edit"
        />
        <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            (onClick)="onDelete(rowData)"
            data-testid="admin-chemical-density-row-delete"
        />
    </div>
</ng-template>
