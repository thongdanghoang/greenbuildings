<div
    class="mt-4 w-[300px] sm:w-[400px] md:w-[500px]"
    data-testid="admin-emission-source-dialog-root"
>
    <!-- Dialog Header -->
    <div
        class="p-dialog-header border-b p-0"
        data-testid="admin-emission-source-dialog-header"
    >
        <span class="text-xl font-semibold">
            {{ 'admin.emissionSource.name' | translate }}
        </span>
        <button
            pButton
            type="button"
            icon="pi pi-times"
            class="p-button-rounded p-button-text"
            (click)="closeDialog()"
            data-testid="admin-emission-source-dialog-close"
        ></button>
    </div>

    <!-- Stepper with Three Steps -->
    <p-stepper
        [value]="1"
        class="block"
        data-testid="admin-emission-source-dialog-stepper"
    >
        <p-step-panels class="block h-full">
            <!-- Step 1: Vietnamese Name -->
            <p-step-panel [value]="1">
                <ng-template
                    #content
                    let-activateCallback="activateCallback"
                >
                    <div class="p-dialog-content flex min-h-[150px] flex-col overflow-hidden p-0">
                        <form
                            [formGroup]="formGroup"
                            data-testid="admin-emission-source-dialog-form-step1"
                        >
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="nameVN"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-source-dialog-name-vn"
                                />
                                <label>{{ 'common.name' | translate }} (VN)</label>
                            </p-iftalabel>
                        </form>
                        <div class="mt-2 flex justify-end">
                            <p-button
                                label="{{ 'common.next' | translate }}"
                                icon="pi pi-arrow-right"
                                iconPos="right"
                                (onClick)="activateCallback(2)"
                                data-testid="admin-emission-source-dialog-next-1"
                            ></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-step-panel>

            <!-- Step 2: English Name -->
            <p-step-panel [value]="2">
                <ng-template
                    #content
                    let-activateCallback="activateCallback"
                >
                    <div class="p-dialog-content flex min-h-[150px] flex-col overflow-hidden p-0">
                        <form
                            [formGroup]="formGroup"
                            data-testid="admin-emission-source-dialog-form-step2"
                        >
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="nameEN"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-source-dialog-name-en"
                                />
                                <label>{{ 'common.name' | translate }} (EN)</label>
                            </p-iftalabel>
                        </form>
                        <div class="mt-2 flex justify-between">
                            <p-button
                                label="{{ 'common.back' | translate }}"
                                severity="secondary"
                                icon="pi pi-arrow-left"
                                (onClick)="activateCallback(1)"
                                data-testid="admin-emission-source-dialog-back-2"
                            ></p-button>
                            <p-button
                                label="{{ 'common.next' | translate }}"
                                icon="pi pi-arrow-right"
                                iconPos="right"
                                (onClick)="activateCallback(3)"
                                data-testid="admin-emission-source-dialog-next-2"
                            ></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-step-panel>

            <!-- Step 3: Chinese Name -->
            <p-step-panel [value]="3">
                <ng-template
                    #content
                    let-activateCallback="activateCallback"
                >
                    <div class="p-dialog-content flex min-h-[150px] flex-col overflow-hidden p-0">
                        <form
                            [formGroup]="formGroup"
                            data-testid="admin-emission-source-dialog-form-step3"
                        >
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="nameZH"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-source-dialog-name-zh"
                                />
                                <label>{{ 'common.name' | translate }} (ZH)</label>
                            </p-iftalabel>
                        </form>
                        <div class="mt-2 flex justify-between">
                            <p-button
                                label="{{ 'common.back' | translate }}"
                                severity="secondary"
                                icon="pi pi-arrow-left"
                                (onClick)="activateCallback(2)"
                                data-testid="admin-emission-source-dialog-back-3"
                            ></p-button>
                            <p-button
                                label="{{ 'common.save' | translate }}"
                                icon="pi pi-check"
                                severity="primary"
                                [disabled]="formGroup.invalid"
                                (onClick)="submit()"
                                data-testid="admin-emission-source-dialog-save"
                            ></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-step-panel>
        </p-step-panels>
    </p-stepper>
</div>
