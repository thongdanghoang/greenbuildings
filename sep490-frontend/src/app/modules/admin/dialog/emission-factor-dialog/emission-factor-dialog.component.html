<div
    class="mt-4 w-[300px] sm:w-[400px] md:w-[500px]"
    data-testid="admin-emission-factor-dialog-root"
>
    <!-- Dialog Header -->
    <div
        class="p-dialog-header border-b p-0"
        data-testid="admin-emission-factor-dialog-header"
    >
        <span class="text-xl font-semibold">
            {{ 'enterprise.emission.activity.record.table.factor' | translate }}
        </span>
        <button
            pButton
            type="button"
            icon="pi pi-times"
            class="p-button-rounded p-button-text"
            (click)="closeDialog()"
            data-testid="admin-emission-factor-dialog-close"
        ></button>
    </div>

    <!-- Stepper with Three Steps -->
    <p-stepper
        [value]="1"
        class="block"
        data-testid="admin-emission-factor-dialog-stepper"
    >
        <p-step-panels class="block h-full">
            <!-- Step 1: Names and Description -->
            <p-step-panel [value]="1">
                <ng-template
                    #content
                    let-activateCallback="activateCallback"
                >
                    <div class="p-dialog-content flex min-h-[400px] flex-col overflow-hidden p-0">
                        <div [formGroup]="formGroup">
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="nameVN"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-factor-dialog-name-vn"
                                />
                                <label>{{ 'common.name' | translate }} (VN)</label>
                            </p-iftalabel>
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="nameEN"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-factor-dialog-name-en"
                                />
                                <label>{{ 'common.name' | translate }} (EN)</label>
                            </p-iftalabel>
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="nameZH"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-factor-dialog-name-zh"
                                />
                                <label>{{ 'common.name' | translate }} (ZH)</label>
                            </p-iftalabel>
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="description"
                                    class="w-full"
                                    autocomplete="off"
                                    data-testid="admin-emission-factor-dialog-description"
                                />
                                <label>{{ 'admin.emissionFactor.description' | translate }}</label>
                            </p-iftalabel>
                        </div>
                        <div class="mt-2 flex justify-end">
                            <p-button
                                label="{{ 'common.next' | translate }}"
                                icon="pi pi-arrow-right"
                                iconPos="right"
                                (onClick)="activateCallback(2)"
                                data-testid="admin-emission-factor-dialog-next-1"
                            ></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-step-panel>

            <!-- Step 2: Emission Values (CO2, CH4, N2O) -->
            <p-step-panel [value]="2">
                <ng-template
                    #content
                    let-activateCallback="activateCallback"
                >
                    <div class="p-dialog-content flex min-h-[400px] flex-col overflow-hidden p-0">
                        <div [formGroup]="formGroup">
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="co2"
                                    class="w-full"
                                    autocomplete="off"
                                    type="number"
                                    data-testid="admin-emission-factor-dialog-co2"
                                />
                                <label>{{ 'CO2' | translate }}</label>
                            </p-iftalabel>
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="ch4"
                                    class="w-full"
                                    autocomplete="off"
                                    type="number"
                                    data-testid="admin-emission-factor-dialog-ch4"
                                />
                                <label>{{ 'CH4' | translate }}</label>
                            </p-iftalabel>
                            <p-iftalabel class="my-2">
                                <input
                                    pInputText
                                    formControlName="n2o"
                                    class="w-full"
                                    autocomplete="off"
                                    type="number"
                                    data-testid="admin-emission-factor-dialog-n2o"
                                />
                                <label>{{ 'N2O' | translate }}</label>
                            </p-iftalabel>
                        </div>
                        <div class="mt-2 flex justify-between">
                            <p-button
                                label="{{ 'common.back' | translate }}"
                                severity="secondary"
                                icon="pi pi-arrow-left"
                                (onClick)="activateCallback(1)"
                                data-testid="admin-emission-factor-dialog-back-2"
                            ></p-button>
                            <p-button
                                label="{{ 'common.next' | translate }}"
                                icon="pi pi-arrow-right"
                                iconPos="right"
                                (onClick)="activateCallback(3)"
                                data-testid="admin-emission-factor-dialog-next-2"
                            ></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-step-panel>

            <!-- Step 3: Validity Dates -->
            <p-step-panel [value]="3">
                <ng-template
                    #content
                    let-activateCallback="activateCallback"
                >
                    <div class="p-dialog-content flex min-h-[400px] flex-col overflow-hidden p-0">
                        <div [formGroup]="formGroup">
                            <p-iftalabel class="my-2">
                                <p-calendar
                                    formControlName="validFrom"
                                    [showIcon]="true"
                                    inputId="validFrom"
                                    dateFormat="dd/mm/yy"
                                    [style]="{width: '100%'}"
                                    data-testid="admin-emission-factor-dialog-valid-from"
                                ></p-calendar>
                                <label>{{ 'enterprise.emission.activity.record.table.startDate' | translate }}</label>
                            </p-iftalabel>
                            <p-iftalabel class="my-2">
                                <p-calendar
                                    formControlName="validTo"
                                    [showIcon]="true"
                                    inputId="validTo"
                                    dateFormat="dd/mm/yy"
                                    [style]="{width: '100%'}"
                                    data-testid="admin-emission-factor-dialog-valid-to"
                                ></p-calendar>
                                <label>{{ 'enterprise.emission.activity.record.table.endDate' | translate }}</label>
                            </p-iftalabel>
                        </div>
                        <div class="mt-2 flex justify-between">
                            <p-button
                                label="{{ 'common.back' | translate }}"
                                severity="secondary"
                                icon="pi pi-arrow-left"
                                (onClick)="activateCallback(2)"
                                data-testid="admin-emission-factor-dialog-back-3"
                            ></p-button>
                            <p-button
                                label="{{ 'common.save' | translate }}"
                                icon="pi pi-check"
                                severity="primary"
                                [disabled]="formGroup.invalid"
                                (onClick)="submit()"
                                data-testid="admin-emission-factor-dialog-save"
                            ></p-button>
                        </div>
                    </div>
                </ng-template>
            </p-step-panel>
        </p-step-panels>
    </p-stepper>
</div>
