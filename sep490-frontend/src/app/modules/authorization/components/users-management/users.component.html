<div
    class="mb-4 flex items-center justify-between border-b pb-1"
    data-testid="users-management-header"
>
    <h1
        class="text-lg font-bold text-primary"
        data-testid="users-management-title"
    >
        {{ 'enterprise.Users.title' | translate }}
    </h1>
</div>
<p
    class="mb-4"
    data-testid="users-management-description"
>
    {{ 'enterprise.Users.description' | translate }}
</p>
<table-template
    [fetch]="fetchUsers"
    [columns]="cols"
    [sort]="undefined"
    [criteria]="searchCriteria"
    [triggerSearch]="searchEvent"
    [triggerClearSelected]="clearSelectedEvent"
    [captionTemplateRef]="captionTemplateRef"
    [checkbox]="true"
    (selectionChange)="onSelectionChange($event)"
    data-testid="users-management-table"
>
</table-template>
<ng-template #captionTemplateRef>
    <div
        class="flex items-center justify-between"
        data-testid="users-management-search"
    >
        <div
            class="flex gap-2.5"
            data-testid="users-management-search-inputs"
        >
            <p-iconfield data-testid="users-management-search-field">
                <p-inputicon styleClass="pi pi-search" />
                <input
                    [(ngModel)]="searchCriteria.criteria"
                    type="text"
                    pInputText
                    placeholder="{{ 'common.search' | translate }}"
                    (keydown.enter)="search()"
                    data-testid="users-management-search-input"
                />
            </p-iconfield>
            <p-button
                severity="primary"
                [label]="'enterprise.Users.search' | translate"
                icon="pi pi-search"
                outlined
                (onClick)="search()"
                data-testid="users-management-search-button"
            />
        </div>
        <div
            class="flex gap-2.5"
            data-testid="users-management-actions"
        ></div>
    </div>
</ng-template>
<ng-template
    #actionsTemplate
    let-rowData
>
    <div
        class="flex"
        data-testid="users-management-row-actions"
    >
        <p-button
            icon="pi pi-pencil"
            [rounded]="true"
            [text]="true"
            severity="info"
            (onClick)="onEdit(rowData)"
            data-testid="users-management-edit"
        />
        <p-button
            icon="pi pi-trash"
            [rounded]="true"
            [text]="true"
            severity="danger"
            (onClick)="onDelete(rowData)"
            data-testid="users-management-delete"
        />
    </div>
</ng-template>
<ng-template
    #scopeTemplate
    let-rowData
>
    <p data-testid="users-management-scope">{{ 'enum.scope.' + rowData.scope | translate }}</p>
</ng-template>
